plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.lloyd.attendance'
    compileSdk 36

    defaultConfig {
        applicationId "com.lloyd.attendance"
        minSdk 26
        targetSdk 36

        def getGitCommitCount = { ->
            try {
                def stdout = new ByteArrayOutputStream()
                exec {
                    commandLine 'git', 'rev-list', '--count', 'HEAD'
                    standardOutput = stdout
                }
                return Integer.parseInt(stdout.toString().trim())
            } catch (Exception e) {
                return 1
            }
        }

        def getGitVersionDesc = { ->
            try {
                def stdout = new ByteArrayOutputStream()
                exec {
                    commandLine 'git', 'describe', '--tags', '--always'
                    standardOutput = stdout
                }
                def desc = stdout.toString().trim().replaceFirst("^v", "")
                return desc.isEmpty() ? "1.0.0" : desc
            } catch (Exception e) {
                return "1.0.0"
            }
        }

        def appVersionCode = Integer.parseInt(project.findProperty('appVersionCode') ?: System.getenv('APP_VERSION_CODE') ?: getGitCommitCount().toString())
        def appVersionName = project.findProperty('appVersionName') ?: System.getenv('APP_VERSION_NAME') ?: getGitVersionDesc()

        versionCode appVersionCode
        versionName appVersionName

        def defaultFleetUrl = project.findProperty('fleetUrl') ?: System.getenv('FLEET_URL') ?: "https://lloyd-erp-sand.vercel.app"
        buildConfigField "String", "DEFAULT_FLEET_URL", "\"${defaultFleetUrl}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("RELEASE_KEYSTORE_PATH")
            if (keystorePath && file(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            } else {
                def userHome = System.getProperty("user.home")
                def debugStore1 = file("${userHome}/.android/debug.keystore")
                def debugStore2 = file("${userHome}/.config/.android/debug.keystore")
                def fallbackStore = file("${project.buildDir}/signing/release-fallback.keystore")

                File targetStore = null
                if (debugStore1.exists()) {
                    targetStore = debugStore1
                } else if (debugStore2.exists()) {
                    targetStore = debugStore2
                } else {
                    fallbackStore.parentFile?.mkdirs()
                    if (!fallbackStore.exists()) {
                        try {
                            def cmd = [
                                "keytool", "-genkeypair",
                                "-alias", "androiddebugkey",
                                "-keyalg", "RSA",
                                "-keysize", "2048",
                                "-validity", "10000",
                                "-keystore", fallbackStore.absolutePath,
                                "-storepass", "android",
                                "-keypass", "android",
                                "-dname", "CN=Android Debug,O=Android,C=US"
                            ]
                            Process proc = cmd.execute()
                            proc.waitFor()
                        } catch (Exception ignored) {}
                    }
                    if (fallbackStore.exists()) {
                        targetStore = fallbackStore
                    }
                }

                if (targetStore != null && targetStore.exists()) {
                    storeFile targetStore
                    storePassword "android"
                    keyAlias "androiddebugkey"
                    keyPassword "android"
                } else {
                    initWith(signingConfigs.debug)
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'io.coil-kt:coil-compose:2.7.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.10.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}

