    <!-- Material Design 3 Design Tokens -->
    <style>
      :root {
        /* MD3 Brand Color Tokens (Light Scheme) */
        --md-sys-color-primary: #1E40AF;
        --md-sys-color-on-primary: #FFFFFF;
        --md-sys-color-primary-container: #DBEAFE;
        --md-sys-color-on-primary-container: #1E3A8A;
        --md-sys-color-secondary: #0F766E;

        --md-sys-color-tertiary-container: #EDE9FE;
        --md-sys-color-on-tertiary-container: #4C1D95;
        --md-sys-color-error: #BA1A1A;
        --md-sys-color-on-error: #FFFFFF;
        --md-sys-color-error-container: #FFDAD6;
        --md-sys-color-on-error-container: #410002;
        --md-sys-color-surface: #F8FAFC;
        --md-sys-color-on-surface: #0F172A;
        --md-sys-color-surface-variant: #E2E8F0;
        --md-sys-color-on-surface-variant: #475569;
        --md-sys-color-outline: #94A3B8;
        --md-sys-color-outline-variant: #CBD5E1;
        --md-sys-color-surface-container-lowest: #FFFFFF;
        --md-sys-color-surface-container-low: #F1F5F9;
        --md-sys-color-surface-container: #E2E8F0;
        --md-sys-color-surface-container-high: #CBD5E1;
        --md-sys-color-surface-container-highest: #94A3B8;

        /* Semantic Attendance Health Tokens */
        --md-custom-color-healthy: #059669;
        --md-custom-color-healthy-container: #D1FAE5;
        --md-custom-color-on-healthy-container: #065F46;
        --md-custom-color-borderline: #D97706;
        --md-custom-color-borderline-container: #FEF3C7;
        --md-custom-color-on-borderline-container: #92400E;
        --md-custom-color-critical: #DC2626;
        --md-custom-color-critical-container: #FEE2E2;
        --md-custom-color-on-critical-container: #991B1B;

        /* MD3 Shape Tokens */
        --md-sys-shape-corner-none: 0px;
        --md-sys-shape-corner-extra-small: 4px;
        --md-sys-shape-corner-small: 8px;
        --md-sys-shape-corner-medium: 12px;
        --md-sys-shape-corner-large: 16px;
        --md-sys-shape-corner-extra-large: 28px;
        --md-sys-shape-corner-full: 9999px;

        /* MD3 Spacing 8dp System */
        --md-sys-spacing-1: 4px;
        --md-sys-spacing-2: 8px;
        --md-sys-spacing-3: 12px;
        --md-sys-spacing-4: 16px;
        --md-sys-spacing-6: 24px;
        --md-sys-spacing-8: 32px;
      }

      /* Dark Theme Overrides */
      :root.dark,
      @media (prefers-color-scheme: dark) {
        :root {
          --md-sys-color-primary: #93C5FD;
          --md-sys-color-on-primary: #1E3A8A;
          --md-sys-color-primary-container: #1E40AF;
          --md-sys-color-on-primary-container: #DBEAFE;
          --md-sys-color-secondary: #5EEAD4;

          --md-sys-color-on-secondary-container: #CCFBF1;
          --md-sys-color-tertiary: #C4B5FD;
          --md-sys-color-on-tertiary: #4C1D95;
          --md-sys-color-tertiary-container: #6D28D9;
          --md-sys-color-on-tertiary-container: #EDE9FE;
          --md-sys-color-error: #FFB4AB;
          --md-sys-color-on-error: #690005;
          --md-sys-color-error-container: #93000A;
          --md-sys-color-on-error-container: #FFDAD6;
          --md-sys-color-surface: #0B0F19;
          --md-sys-color-on-surface: #F1F5F9;
          --md-sys-color-surface-variant: #1E293B;
          --md-sys-color-on-surface-variant: #94A3B8;
          --md-sys-color-outline: #475569;
          --md-sys-color-outline-variant: #334155;
          --md-sys-color-surface-container-lowest: #030712;
          --md-sys-color-surface-container-low: #0F172A;
          --md-sys-color-surface-container: #1E293B;
          --md-sys-color-surface-container-high: #334155;
          --md-sys-color-surface-container-highest: #475569;

          --md-custom-color-healthy: #34D399;
          --md-custom-color-healthy-container: #064E3B;
          --md-custom-color-on-healthy-container: #A7F3D0;
          --md-custom-color-borderline: #FBBF24;
          --md-custom-color-borderline-container: #78350F;
          --md-custom-color-on-borderline-container: #FDE68A;
          --md-custom-color-critical: #F87171;
          --md-custom-color-critical-container: #7F1D1D;
          --md-custom-color-on-critical-container: #FECACA;
        }
      }
