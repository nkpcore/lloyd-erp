name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish official GitHub Release and update fleet server'
        required: true
        type: boolean
        default: true
      version_tag:
        description: 'Release version tag (e.g. v1.1.0; leave empty for auto v1.0.<run_number>)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for Gradle wrapper
        run: |
          cd android
          chmod +x gradlew

      - name: Run Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android Lint Quality Gate
        run: |
          cd android
          ./gradlew lintDebug --no-daemon --stacktrace

      - name: Setup Signing Keystore for Runner
        run: |
          mkdir -p ~/.android
          mkdir -p ~/.config/.android
          if [ -n "${{ secrets.RELEASE_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > "$HOME/.android/release.keystore"
            echo "RESTORED_KEYSTORE_PATH=$HOME/.android/release.keystore" >> $GITHUB_ENV
          else
            echo "Using committed repository release keystore android/app/release.jks"
          fi

      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ env.RESTORED_KEYSTORE_PATH || secrets.RELEASE_KEYSTORE_PATH }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          VERSION_CODE=$((200 + ${{ github.run_number }}))
          VERSION_NAME="1.0.${{ github.run_number }}"
          if [ -n "${{ inputs.version_tag }}" ]; then
            VERSION_NAME="${{ inputs.version_tag }}"
            VERSION_NAME="${VERSION_NAME#v}"
          fi
          ./gradlew assembleRelease -PappVersionCode=${VERSION_CODE} -PappVersionName="${VERSION_NAME}" --no-daemon --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          VERSION_TAG="v1.0.${{ github.run_number }}"
          if [ -n "${{ inputs.version_tag }}" ]; then
            VERSION_TAG="${{ inputs.version_tag }}"
          fi
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          DEST_APK="release-artifacts/LloydAttendance-${VERSION_TAG}.apk"
          
          if [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "$DEST_APK"
          else
            FOUND_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
            cp "$FOUND_APK" "$DEST_APK"
          fi
          
          cd release-artifacts
          sha256sum "LloydAttendance-${VERSION_TAG}.apk" > "LloydAttendance-${VERSION_TAG}.apk.sha256"
          ls -la

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LloydAttendance-v1.0.${{ github.run_number }}
          path: release-artifacts/*

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true')
        with:
          tag_name: ${{ inputs.version_tag != '' && inputs.version_tag || format('v1.0.{0}', github.run_number) }}
          name: ${{ inputs.version_tag != '' && format('Lloyd Attendance {0}', inputs.version_tag) || format('Lloyd Attendance v1.0.{0}', github.run_number) }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          body: |
            ## 🚀 Lloyd Attendance Release `${{ inputs.version_tag != '' && inputs.version_tag || format('v1.0.{0}', github.run_number) }}`
            
            ### 📱 What's New & Included
            - **Native Material Design 3 Expressive UI** (dynamic color theming, edge-to-edge system bars, M3 typography & cards).
            - **AKTU Syllabus In-App Viewer**: Complete 2026-27 university curriculum bundled directly inside the APK with native PDF rendering, table of contents, and search.
            - **Daily Attendance Logs**: Clean 12-hour timestamps, date headers, and status badges.
            - **Intelligent Attendance Change Detector**: Real-time notifications triggered exclusively on actual status changes (marked Present or Absent).
            - **Comprehensive ERP Discovery Integration**: High-fidelity subject metadata, room numbers, teacher names, syllabus trackers, and Bunk Safe zone analytics.
            
            ### 📥 Download & Installation
            Download the signed APK below directly to your Android device to install or update.
            - Checksum verification available in `.sha256`.
          files: |
            release-artifacts/*.apk
            release-artifacts/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Broadcast Release to Fleet Server
        if: success() && github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true')
        env:
          FLEET_SERVER_URL: ${{ secrets.FLEET_SERVER_URL }}
          FLEET_ADMIN_TOKEN: ${{ secrets.FLEET_ADMIN_TOKEN }}
        run: |
          if [ -n "$FLEET_SERVER_URL" ]; then
            VERSION_TAG="${{ inputs.version_tag != '' && inputs.version_tag || format('v1.0.{0}', github.run_number) }}"
            echo "Broadcasting $VERSION_TAG to fleet server $FLEET_SERVER_URL..."
            AUTH_HEADER=""
            if [ -n "$FLEET_ADMIN_TOKEN" ]; then
              AUTH_HEADER="Authorization: Bearer $FLEET_ADMIN_TOKEN"
            fi
            curl -s -X POST "${FLEET_SERVER_URL%/}/config" \
              -H "Content-Type: application/json" \
              ${AUTH_HEADER:+-H "$AUTH_HEADER"} \
              -d "{\"latest_version_name\":\"${VERSION_TAG}\",\"broadcast_notice\":\"New update ${VERSION_TAG} released.\"}"
          fi
